<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect width="1000" height="640" fill="#FAFAF8"/>
  <g stroke="#E7E5DD" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="280" x2="1000" y2="280"/><line x1="0" y1="320" x2="1000" y2="320"/><line x1="0" y1="360" x2="1000" y2="360"/><line x1="0" y1="400" x2="1000" y2="400"/><line x1="0" y1="440" x2="1000" y2="440"/><line x1="0" y1="480" x2="1000" y2="480"/><line x1="0" y1="520" x2="1000" y2="520"/><line x1="0" y1="560" x2="1000" y2="560"/><line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="40" y1="0" x2="40" y2="640"/><line x1="120" y1="0" x2="120" y2="640"/><line x1="200" y1="0" x2="200" y2="640"/><line x1="280" y1="0" x2="280" y2="640"/><line x1="360" y1="0" x2="360" y2="640"/><line x1="440" y1="0" x2="440" y2="640"/><line x1="520" y1="0" x2="520" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/><line x1="680" y1="0" x2="680" y2="640"/><line x1="760" y1="0" x2="760" y2="640"/><line x1="840" y1="0" x2="840" y2="640"/><line x1="920" y1="0" x2="920" y2="640"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#111111"/></marker>
    <g id="dp"><path d="M0 0 C 6 8, 7 11, 0 18 C -7 11, -6 8, 0 0 Z" fill="#F2C522"/></g>
  </defs>

  <text x="60" y="64" font-family="'IBM Plex Mono',monospace" font-size="15" letter-spacing="1.5" fill="#111111" opacity="0.55">HOW YOUR SHOP REALLY RUNS</text>
  <rect x="742" y="44" width="16" height="12" fill="#F2C522"/><text x="766" y="54" font-size="13" fill="#111111" opacity="0.7">leaking out</text>
  <rect x="742" y="66" width="16" height="12" fill="#C9C6BC"/><text x="766" y="76" font-size="13" fill="#111111" opacity="0.7">sitting unused</text>

  <text x="52" y="150" font-size="13" fill="#111111" opacity="0.6">calls in</text>
  <line x1="52" y1="162" x2="112" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="120" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="184" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Call</text>
  <rect x="316" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="380" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Quote</text>
  <rect x="512" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="576" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Schedule</text>
  <rect x="708" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="772" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Invoice</text>
  <rect x="880" y="132" width="96" height="60" fill="#111111" stroke="#111111" stroke-width="2.5"/><text x="928" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#F2C522">Paid</text>
  <line x1="248" y1="162" x2="312" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="640" y1="162" x2="704" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>

  <path d="M82 168 C 84 200, 78 214, 82 236" fill="none" stroke="#F2C522" stroke-width="5" stroke-linecap="round"/><use href="#dp" x="82" y="240"/>
  <text x="60" y="286" font-size="14" font-weight="700" fill="#111111">Missed call</text><text x="60" y="304" font-size="12" fill="#111111" opacity="0.6">to voicemail, gone</text>
  <line x1="444" y1="162" x2="470" y2="162" stroke="#F2C522" stroke-width="5" stroke-linecap="round"/><line x1="486" y1="162" x2="508" y2="162" stroke="#111111" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#ar)"/>
  <path d="M470 168 C 474 200, 466 214, 470 236" fill="none" stroke="#F2C522" stroke-width="5" stroke-linecap="round"/><use href="#dp" x="470" y="240"/>
  <text x="448" y="286" font-size="14" font-weight="700" fill="#111111">Quote goes quiet</text><text x="448" y="304" font-size="12" fill="#111111" opacity="0.6">no follow up</text>
  <line x1="836" y1="162" x2="856" y2="162" stroke="#F2C522" stroke-width="5" stroke-linecap="round"/><line x1="864" y1="162" x2="878" y2="162" stroke="#111111" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#ar)"/>
  <path d="M852 168 C 856 200, 848 214, 852 236" fill="none" stroke="#F2C522" stroke-width="5" stroke-linecap="round"/><use href="#dp" x="852" y="240"/>
  <text x="790" y="286" font-size="14" font-weight="700" fill="#111111">Invoice not chased</text><text x="790" y="304" font-size="12" fill="#111111" opacity="0.6">paid late, or never</text>

  <!-- hidden money, left -->
  <text x="64" y="404" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="1" fill="#111111" opacity="0.6">MONEY JUST SITTING HERE</text>
  <g stroke="#8A877E" stroke-width="2">
    <circle cx="104" cy="470" r="24" fill="#C9C6BC"/><circle cx="152" cy="470" r="24" fill="#C9C6BC"/><circle cx="200" cy="470" r="24" fill="#C9C6BC"/>
    <circle cx="128" cy="442" r="24" fill="#C9C6BC"/><circle cx="176" cy="442" r="24" fill="#C9C6BC"/>
  </g>
  <g fill="#6B6B6B" font-size="18" font-weight="800" text-anchor="middle">
    <text x="104" y="477">$</text><text x="152" y="477">$</text><text x="200" y="477">$</text><text x="128" y="449">$</text><text x="176" y="449">$</text>
  </g>
  <text x="64" y="528" font-size="13" fill="#111111" opacity="0.75">Past customers. Referrals nobody asks for.</text>
  <text x="64" y="548" font-size="13" fill="#111111" opacity="0.75">The gap between your best crew and the rest.</text>

  <!-- owner, center -->
  <g stroke="#111111" stroke-width="1.6" stroke-dasharray="3 5" fill="none">
    <line x1="470" y1="430" x2="392" y2="196"/><line x1="500" y1="430" x2="576" y2="196"/><line x1="540" y1="430" x2="760" y2="196"/>
  </g>
  <rect x="404" y="430" width="192" height="64" fill="#FFF8D6" stroke="#111111" stroke-width="2.5"/>
  <text x="500" y="462" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">The Owner</text>
  <text x="500" y="482" text-anchor="middle" font-size="12" fill="#111111" opacity="0.7">it all still runs through you</text>

  <!-- title block, pulled up -->
  <rect x="700" y="516" width="276" height="82" fill="#FBFAF6" stroke="#111111" stroke-width="2"/>
  <line x1="700" y1="544" x2="976" y2="544" stroke="#111111" stroke-width="1.2"/><line x1="838" y1="544" x2="838" y2="598" stroke="#111111" stroke-width="1.2"/>
  <text x="712" y="536" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#111111">OPERATIONS BLUEPRINT</text>
  <text x="712" y="566" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#111111" opacity="0.7">DRAWN BY</text>
  <text x="712" y="586" font-size="16" font-weight="700" fill="#111111">BuildWithBooz</text>
  <text x="850" y="566" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#111111" opacity="0.7">FOUND</text>
  <text x="850" y="586" font-size="14" font-weight="700" fill="#111111">leaks + unused</text>
</svg>
