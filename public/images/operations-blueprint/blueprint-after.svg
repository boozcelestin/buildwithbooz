<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
  <rect width="1000" height="640" fill="#FAFAF8"/>
  <g stroke="#E7E5DD" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="280" x2="1000" y2="280"/><line x1="0" y1="320" x2="1000" y2="320"/><line x1="0" y1="360" x2="1000" y2="360"/><line x1="0" y1="400" x2="1000" y2="400"/><line x1="0" y1="440" x2="1000" y2="440"/><line x1="0" y1="480" x2="1000" y2="480"/><line x1="0" y1="520" x2="1000" y2="520"/><line x1="0" y1="560" x2="1000" y2="560"/><line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="40" y1="0" x2="40" y2="640"/><line x1="120" y1="0" x2="120" y2="640"/><line x1="200" y1="0" x2="200" y2="640"/><line x1="280" y1="0" x2="280" y2="640"/><line x1="360" y1="0" x2="360" y2="640"/><line x1="440" y1="0" x2="440" y2="640"/><line x1="520" y1="0" x2="520" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/><line x1="680" y1="0" x2="680" y2="640"/><line x1="760" y1="0" x2="760" y2="640"/><line x1="840" y1="0" x2="840" y2="640"/><line x1="920" y1="0" x2="920" y2="640"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#111111"/></marker>
    <g id="seal"><circle r="14" fill="#22C55E"/><path d="M-6 0 L-2 5 L7 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>

  <text x="60" y="64" font-family="'IBM Plex Mono',monospace" font-size="15" letter-spacing="1.5" fill="#1B7A3D" opacity="0.9">HOW IT RUNS ONCE IT IS FIXED</text>
  <use href="#seal" x="750" y="50"/><text x="772" y="55" font-size="13" fill="#111111" opacity="0.7">sealed, runs on its own</text>

  <text x="52" y="150" font-size="13" fill="#111111" opacity="0.6">calls in</text>
  <line x1="52" y1="162" x2="112" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="120" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="184" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Call</text>
  <rect x="316" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="380" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Quote</text>
  <rect x="512" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="576" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Schedule</text>
  <rect x="708" y="132" width="128" height="60" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/><text x="772" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Invoice</text>
  <rect x="880" y="132" width="96" height="60" fill="#111111" stroke="#111111" stroke-width="2.5"/><text x="928" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#F2C522">Paid</text>
  <line x1="248" y1="162" x2="312" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="444" y1="162" x2="508" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="640" y1="162" x2="704" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="836" y1="162" x2="876" y2="162" stroke="#111111" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- seals where leaks were -->
  <use href="#seal" x="82" y="232"/><text x="60" y="286" font-size="14" font-weight="700" fill="#111111">Every call answered</text><text x="60" y="304" font-size="12" fill="#111111" opacity="0.6">text back in seconds</text>
  <use href="#seal" x="470" y="232"/><text x="448" y="286" font-size="14" font-weight="700" fill="#111111">Quotes follow up</text><text x="448" y="304" font-size="12" fill="#111111" opacity="0.6">on their own</text>
  <use href="#seal" x="852" y="232"/><text x="790" y="286" font-size="14" font-weight="700" fill="#111111">Invoices chase</text><text x="790" y="304" font-size="12" fill="#111111" opacity="0.6">themselves</text>

  <!-- money now working (green), same spot as the before -->
  <text x="64" y="404" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="1" fill="#1B7A3D" opacity="0.9">NOW WORKING FOR YOU</text>
  <g stroke="#1B7A3D" stroke-width="2">
    <circle cx="104" cy="470" r="24" fill="#BDEBC9"/><circle cx="152" cy="470" r="24" fill="#BDEBC9"/><circle cx="200" cy="470" r="24" fill="#BDEBC9"/>
    <circle cx="128" cy="442" r="24" fill="#BDEBC9"/><circle cx="176" cy="442" r="24" fill="#BDEBC9"/>
  </g>
  <g fill="#1B7A3D" font-size="18" font-weight="800" text-anchor="middle">
    <text x="104" y="477">$</text><text x="152" y="477">$</text><text x="200" y="477">$</text><text x="128" y="449">$</text><text x="176" y="449">$</text>
  </g>
  <text x="64" y="528" font-size="13" fill="#111111" opacity="0.75">Past customers back. Referrals coming in.</text>
  <text x="64" y="548" font-size="13" fill="#111111" opacity="0.75">Every crew working at your best crew's level.</text>

  <!-- owner, out of the middle, no dependence web -->
  <path d="M576 456 C 640 456, 660 300, 576 200" fill="none" stroke="#1B7A3D" stroke-width="1.6" stroke-dasharray="3 6"/>
  <text x="606" y="360" font-size="12" fill="#1B7A3D" opacity="0.85">you just see the numbers</text>
  <rect x="404" y="430" width="192" height="64" fill="#FBFAF6" stroke="#111111" stroke-width="2.5"/>
  <text x="500" y="462" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">The Owner</text>
  <text x="500" y="482" text-anchor="middle" font-size="12" fill="#111111" opacity="0.7">out of the daily flow now</text>

  <!-- title block -->
  <rect x="700" y="516" width="276" height="82" fill="#FBFAF6" stroke="#111111" stroke-width="2"/>
  <line x1="700" y1="544" x2="976" y2="544" stroke="#111111" stroke-width="1.2"/><line x1="838" y1="544" x2="838" y2="598" stroke="#111111" stroke-width="1.2"/>
  <text x="712" y="536" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#111111">OPERATIONS BLUEPRINT</text>
  <text x="712" y="566" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#111111" opacity="0.7">STATE</text>
  <text x="712" y="586" font-size="16" font-weight="700" fill="#1B7A3D">After the fix</text>
  <text x="850" y="566" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#111111" opacity="0.7">LEAKS</text>
  <text x="850" y="586" font-size="18" font-weight="800" fill="#1B7A3D">0</text>
</svg>
